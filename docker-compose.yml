services:
  wardrobe:
    build: .
    container_name: wardrobe
    restart: unless-stopped
    ports:
      - "8321:8000"
    volumes:
      - ./data:/data
    environment:
      - TZ=${TZ:-America/New_York}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
      # Optional: OpenAI-compatible local AI (Ollama / LM Studio), e.g.
      # OPENAI_BASE_URL=http://192.168.1.10:11434/v1  OPENAI_MODEL=llama3.1
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-llama3.1}
